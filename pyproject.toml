[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-cmd-correction"
version = "0.1.0"
description = "Cheap, robust correction of noisy voice commands for restricted-vocabulary robotics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "difflib-match>=0.1.0; python_version < '3.10'",
]

[project.optional-dependencies]
figures = ["matplotlib", "numpy"]
audio = ["sounddevice", "faster-whisper", "SpeechRecognition"]

[tool.hatch.build.targets.wheel]
packages = ["voice_correction"]
